name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly re-scan for advisories published after the last push (security
  # job only). Once a week keeps the private repo's Actions minutes low.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.24.5"
  # Production API: vercel.json's CSP connect-src must allow its origin.
  # The Vercel build repeats the check with the real FLUTTER_API_BASE_URL.
  PRODUCTION_API_BASE_URL: "https://api.pennypincherpro.online/api/v1"
  # Scanners are built from source with `go install`: the module checksum
  # database (sum.golang.org) verifies every module, and no release binary
  # or third-party action is trusted. Update the versions together.
  GOTOOLCHAIN: "go1.27.3"
  OSV_SCANNER_VERSION: "v2.7.0"
  GITLEAKS_VERSION: "v8.30.1"

jobs:
  check:
    name: Analyze, test and build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Check generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          # injectable_generator orders registrations without dependencies between them with an
          # unstable sort, so the DI config is compared ignoring line order.
          config=lib/core/di/injection.config.dart
          diff <(git show HEAD:$config | sort) <(sort $config)
          git checkout -- $config
          git status --porcelain -- lib test
          git --no-pager diff -- lib test
          test -z "$(git status --porcelain -- lib test)"

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Check Vercel configuration
        run: |
          python3 -m json.tool vercel.json > /dev/null
          dart tool/check_vercel_config.dart --api-base-url "$PRODUCTION_API_BASE_URL"

      - name: Check shell scripts
        run: shellcheck --external-sources tool/*.sh

      - name: Vercel build script rejects unsafe configuration
        env:
          FLUTTER_SDK_DIR: ${{ env.FLUTTER_ROOT }}
          FLUTTER_API_BASE_URL: ${{ env.PRODUCTION_API_BASE_URL }}
          FLUTTER_GOOGLE_CLIENT_ID: 123456789012-placeholder.apps.googleusercontent.com
          FLUTTER_GOOGLE_REDIRECT_URI: https://app.pennypincherpro.online/auth.html
        run: |
          expect_failure() {
            if env "$@" bash tool/vercel_build.sh; then
              echo "::error::tool/vercel_build.sh accepted: $*"
              exit 1
            fi
          }
          expect_failure DEV_LOGIN=true
          expect_failure FLUTTER_DEV_LOGIN=1
          expect_failure FLUTTER_GOOGLE_CLIENT_ID=
          expect_failure FLUTTER_API_BASE_URL=http://localhost:8080/api/v1
          expect_failure FLUTTER_API_BASE_URL=https://api.example.com/api/v1

      # Same script and defines as the Vercel production build; it also
      # fails if the bundle mentions localhost or the dev login.
      - name: Build web release (Vercel build script)
        env:
          FLUTTER_SDK_DIR: ${{ env.FLUTTER_ROOT }}
          FLUTTER_API_BASE_URL: ${{ env.PRODUCTION_API_BASE_URL }}
          FLUTTER_GOOGLE_CLIENT_ID: 123456789012-placeholder.apps.googleusercontent.com
          FLUTTER_GOOGLE_REDIRECT_URI: https://app.pennypincherpro.online/auth.html
        run: bash tool/vercel_build.sh

  docker:
    name: Docker image
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag pennypincher-frontend:ci .

      - name: Smoke test
        run: |
          docker run --detach --name frontend --publish 8080:80 pennypincher-frontend:ci
          for attempt in $(seq 1 15); do
            curl --silent --fail http://localhost:8080/healthz && break
            sleep 2
          done
          curl --silent --fail http://localhost:8080/ | grep -q "<title>PennyPincher Pro</title>"
          curl --silent --fail http://localhost:8080/net-worth/assets | grep -q "flutter_bootstrap.js"
          curl --silent --fail http://localhost:8080/auth.html | grep -q "auth_callback.js"
          curl --silent --fail http://localhost:8080/auth_callback.js | grep -q "flutter-web-auth-2"
          docker rm --force frontend

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out (full history for gitleaks)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache scanners
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/bin
          key: >-
            scanners-${{ runner.os }}-${{ env.GOTOOLCHAIN }}-osv-${{ env.OSV_SCANNER_VERSION }}-gitleaks-${{ env.GITLEAKS_VERSION }}

      - name: Install scanners
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          go install "github.com/google/osv-scanner/v2/cmd/osv-scanner@${OSV_SCANNER_VERSION}"
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"

      - name: Add scanners to PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: osv-scanner (pubspec.lock, fails on HIGH/CRITICAL)
        run: bash tool/osv_scan.sh

      - name: gitleaks (full git history)
        run: gitleaks git --redact --no-banner --log-opts="--all" .

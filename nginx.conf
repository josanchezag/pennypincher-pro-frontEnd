# Template rendered by the nginx image entrypoint: ${API_ORIGIN} is replaced
# with the environment variable of the same name when the container starts.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    include /etc/nginx/mime.types;
    types {
        font/ttf ttf;
        font/otf otf;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json application/wasm image/svg+xml
               font/ttf font/otf;

    # Security headers (inherited by every location below, which only use
    # `expires` for caching so these are never dropped).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ${API_ORIGIN} https://fonts.gstatic.com https://*.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Flutter file names are not content-hashed: always revalidate the app
    # code, entry points and assets/ (asset and font manifests, NOTICES and
    # fonts change with each release); revalidation is a cheap 304 via ETag.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Missing assets are real 404s, never the SPA fallback.
    location /assets/ {
        expires -1;
        try_files $uri =404;
    }

    # Icons and the CanvasKit runtime only change with a Flutter upgrade.
    location ~ ^/(canvaskit|icons)/ {
        expires 1d;
        try_files $uri =404;
    }
}

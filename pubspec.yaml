name: pennypincher_pro
description: "PennyPincher Pro: personal finance command center."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0 <3.25.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  dartz: ^0.10.1
  dio: ^5.7.0
  equatable: ^2.0.5
  fl_chart: ^0.68.0
  flutter_bloc: ^8.1.6
  flutter_secure_storage: ^9.2.2
  flutter_web_auth_2: ^4.0.1
  freezed_annotation: ^2.4.4
  get_it: ^8.0.0
  go_router: ^14.3.0
  injectable: ^2.5.0
  intl: ^0.19.0
  json_annotation: ^4.9.0
  reactive_forms: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  build_runner: ^2.4.13
  flutter_lints: ^4.0.0
  freezed: ^2.5.7
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
          weight: 400
